plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'az.nexgen.bjhelper'
    compileSdk 34

    defaultConfig {
        applicationId 'az.nexgen.bjhelper'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '0.8'
    }

    // A fixed debug key, so every build is signed the same way and installs over the previous one.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
